<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chemistry Teacher's Day Quest</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .font-handwriting { font-family: 'Caveat', cursive; }

        /* Stage 1 Glassware Containers */
        .glassware-slot {
            width: 64px;
            height: 100px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: absolute;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            touch-action: none;
            cursor: grab;
        }

        .glassware-slot.dragging {
            transition: none !important;
            z-index: 50;
            cursor: grabbing;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7));
            transform: scale(1.15);
        }

        /* Bubbling Effect in Stage 2 */
        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: bubbleUp 1.8s infinite ease-in;
        }

        /* Reaction Explosion Keyframes */
        @keyframes flashShake {
            0% { transform: translate(0, 0) scale(1); }
            15% { transform: translate(-8px, 6px) scale(1.03); }
            30% { transform: translate(8px, -6px) scale(0.97); }
            45% { transform: translate(-6px, -4px) scale(1.02); }
            60% { transform: translate(6px, 4px) scale(0.98); }
            75% { transform: translate(-4px, 2px) scale(1.01); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .exploding {
            animation: flashShake 0.6s ease-in-out;
        }

        /* 3D Envelope Styling */
        .envelope-wrapper {
            perspective: 1000px;
            width: 300px;
            height: 190px;
            position: relative;
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1e1b4b;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(99, 102, 241, 0.3);
            cursor: pointer;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #312e81;
            transform-origin: top;
            transition: transform 0.5s ease, z-index 0.5s;
            z-index: 5;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .wax-seal {
            position: absolute;
            top: 75px;
            left: 130px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fbbf24, #b45309);
            border: 2px solid #fef08a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #451a03;
            font-size: 16px;
            z-index: 6;
            transition: opacity 0.3s;
        }

        .envelope.open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        .envelope-pocket-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #2e1065;
            border-top: 95px solid transparent;
            border-bottom: 95px solid transparent;
            border-radius: 10px 0 0 10px;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-pocket-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-right: 150px solid #2e1065;
            border-top: 95px solid transparent;
            border-bottom: 95px solid transparent;
            border-radius: 0 10px 10px 0;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-pocket-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 110px solid #3b0764;
            border-radius: 0 0 10px 10px;
            z-index: 4;
            pointer-events: none;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 12px;
            width: 276px;
            height: 165px;
            background: #fffdfa;
            color: #0f172a;
            border-radius: 6px;
            padding: 16px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.8s, height 0.8s;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow-y: auto;
            border: 1px solid #fef3c7;
        }

        /* Multi-step envelope unfold transition */
        .envelope.open .letter {
            animation: unfoldLetter 0.9s forwards ease-in-out;
        }

        @keyframes unfoldLetter {
            0% { transform: translateY(0); z-index: 2; height: 165px; }
            50% { transform: translateY(-190px); z-index: 2; height: 165px; }
            51% { z-index: 10; }
            100% { transform: translateY(-30px) scale(1.08); z-index: 10; height: 320px; }
        }
    </style>
</head>
<body class="w-screen h-screen flex justify-center items-center bg-gray-950 overflow-hidden text-gray-100">

    <div class="relative w-full max-w-md h-full flex flex-col justify-between p-4 my-auto">

        <!-- STAGE 1: GLASSWARE SORTING -->
        <div id="stage-1" class="flex-1 flex flex-col items-center justify-center gap-8">
            <div id="sort-container" class="relative w-full h-32 flex items-center justify-center">
                <!-- Flasks inserted via JS -->
            </div>
        </div>

        <!-- STAGE 2: REACTION VESSEL -->
        <div id="stage-2" class="hidden flex-1 flex flex-col items-center justify-center gap-6">
            <div id="reaction-area" class="relative w-64 h-64 flex items-center justify-center">
                <!-- Central Large Flask with SVG Clipping -->
                <svg width="220" height="240" viewBox="0 0 200 220" class="drop-shadow-[0_0_20px_rgba(99,102,241,0.25)]">
                    <defs>
                        <clipPath id="flask-clip">
                            <!-- Interior area of Erlenmeyer Flask -->
                            <path d="M 82,25 L 118,25 L 118,75 L 178,185 C 182,195 174,205 162,205 L 38,205 C 26,205 18,195 22,185 L 82,75 Z" />
                        </clipPath>
                    </defs>

                    <!-- Liquid Layer clipped strictly inside flask -->
                    <g clip-path="url(#flask-clip)">
                        <rect id="liquid-body" x="0" y="210" width="200" height="200" fill="#3b82f6" class="transition-all duration-700 ease-out" />
                        <ellipse id="liquid-surface" cx="100" cy="210" rx="90" ry="12" fill="#60a5fa" class="transition-all duration-700 ease-out" />
                    </g>

                    <!-- Bubbles Overlay Container -->
                    <foreignObject x="0" y="0" width="200" height="220" style="clip-path: url(#flask-clip);">
                        <div id="bubbles-container" class="w-full h-full relative"></div>
                    </foreignObject>

                    <!-- Glass Outer Contour & Highlights -->
                    <path d="M 80,20 L 120,20 L 120,75 L 180,185 C 185,198 175,208 160,208 L 40,208 C 25,208 15,198 20,185 L 80,75 Z" 
                          fill="none" stroke="#93c5fd" stroke-width="4" stroke-linejoin="round" opacity="0.85" />
                    <rect x="75" y="15" width="50" height="8" rx="3" fill="#93c5fd" opacity="0.9" />
                    <path d="M 88,80 L 42,175" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />
                </svg>
            </div>

            <!-- Reagent Palette -->
            <div id="reagent-bar" class="flex gap-4">
                <button onclick="addReagent('#3b82f6')" class="w-12 h-12 rounded-full bg-blue-600 border-2 border-blue-300 shadow-lg active:scale-90 transition"></button>
                <button onclick="addReagent('#10b981')" class="w-12 h-12 rounded-full bg-emerald-500 border-2 border-emerald-200 shadow-lg active:scale-90 transition"></button>
                <button onclick="addReagent('#eab308')" class="w-12 h-12 rounded-full bg-yellow-500 border-2 border-yellow-200 shadow-lg active:scale-90 transition"></button>
                <button onclick="addReagent('#a855f7')" class="w-12 h-12 rounded-full bg-purple-600 border-2 border-purple-300 shadow-lg active:scale-90 transition"></button>
            </div>
        </div>

        <!-- STAGE 3: ENVELOPE -->
        <div id="stage-3" class="hidden flex-1 flex flex-col items-center justify-center">
            <div class="envelope-wrapper">
                <div id="envelope" class="envelope" onclick="openEnvelope()">
                    <div class="envelope-flap"></div>
                    <div class="wax-seal"><i class="fas fa-heart"></i></div>
                    <div class="envelope-pocket-left"></div>
                    <div class="envelope-pocket-right"></div>
                    <div class="envelope-pocket-bottom"></div>
                    
                    <div class="letter">
                        <div class="text-center pb-2 border-b border-amber-200 mb-2">
                            <span class="text-[10px] font-bold tracking-widest text-indigo-900 uppercase">Happy Teacher's Day</span>
                            <h3 class="text-2xl font-bold font-handwriting text-indigo-950 mt-0.5">Dear Teacher,</h3>
                        </div>
                        <div class="space-y-2 font-handwriting text-base md:text-lg text-slate-800 leading-snug">
                            <p>Thank you for inspiring us, guiding us, and making learning an unforgettable reaction!</p>
                            <p>Your passion ignites our curiosity every single day.</p>
                            <p class="text-right font-bold text-indigo-950 pt-2">With appreciation,<br>Your Students</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* STAGE 1: FLUID DRAG & DROP SORTING */
        const glasswareData = [
            { id: 0, color: '#3b82f6', shape: 'erlenmeyer' },
            { id: 1, color: '#6366f1', shape: 'round' },
            { id: 2, color: '#8b5cf6', shape: 'triangular' },
            { id: 3, color: '#a855f7', shape: 'rectangular' },
            { id: 4, color: '#10b981', shape: 'volumetric' }
        ];

        // Shuffle order initially
        let currentOrder = [2, 0, 4, 1, 3];
        const container = document.getElementById('sort-container');
        let slotWidth = 68;

        function getSVG(shape, color) {
            switch(shape) {
                case 'erlenmeyer':
                    return `<svg width="50" height="70" viewBox="0 0 60 80"><path d="M 23,10 L 37,10 L 37,30 L 53,65 C 55,70 50,75 44,75 L 16,75 C 10,75 5,70 7,65 L 23,30 Z" fill="${color}" opacity="0.85"/><path d="M 22,8 L 38,8 L 38,30 L 55,66 C 57,71 52,77 45,77 L 15,77 C 8,77 3,71 5,66 L 22,30 Z" fill="none" stroke="#e0f2fe" stroke-width="3"/></svg>`;
                case 'round':
                    return `<svg width="50" height="70" viewBox="0 0 60 80"><path d="M 24,10 L 36,10 L 36,32 A 22,22 0 1,1 24,32 Z" fill="${color}" opacity="0.85"/><path d="M 23,8 L 37,8 L 37,31 A 24,24 0 1,1 23,31 Z" fill="none" stroke="#e0f2fe" stroke-width="3"/></svg>`;
                case 'triangular':
                    return `<svg width="50" height="70" viewBox="0 0 60 80"><path d="M 23,10 L 37,10 L 37,25 L 55,68 C 57,73 53,75 47,75 L 13,75 C 7,75 3,73 5,68 L 23,25 Z" fill="${color}" opacity="0.85"/><path d="M 22,8 L 38,8 L 38,25 L 57,69 C 59,74 54,77 48,77 L 12,77 C 6,77 1,74 3,69 L 22,25 Z" fill="none" stroke="#e0f2fe" stroke-width="3"/></svg>`;
                case 'rectangular':
                    return `<svg width="50" height="70" viewBox="0 0 60 80"><path d="M 22,10 L 38,10 L 38,22 L 50,22 L 50,72 L 10,72 L 10,22 L 22,22 Z" fill="${color}" opacity="0.85"/><path d="M 20,8 L 40,8 L 40,20 L 52,20 L 52,74 L 8,74 L 8,20 L 20,20 Z" fill="none" stroke="#e0f2fe" stroke-width="3"/></svg>`;
                case 'volumetric':
                    return `<svg width="50" height="70" viewBox="0 0 60 80"><path d="M 26,8 L 34,8 L 34,40 C 44,44 48,52 48,62 C 48,72 40,76 30,76 C 20,76 12,72 12,62 C 12,52 16,44 26,40 Z" fill="${color}" opacity="0.85"/><path d="M 25,6 L 35,6 L 35,39 C 45,43 50,52 50,62 C 50,74 41,78 30,78 C 19,78 10,74 10,62 C 10,52 15,43 25,39 Z" fill="none" stroke="#e0f2fe" stroke-width="3"/></svg>`;
            }
        }

        function renderGlassware() {
            container.innerHTML = '';
            const totalWidth = currentOrder.length * slotWidth;
            const startX = (container.clientWidth - totalWidth) / 2;

            currentOrder.forEach((itemIdx, posIndex) => {
                const item = glasswareData[itemIdx];
                const slot = document.createElement('div');
                slot.className = 'glassware-slot';
                slot.dataset.id = itemIdx;
                slot.style.left = `${startX + posIndex * slotWidth}px`;
                slot.innerHTML = getSVG(item.shape, item.color);

                setupPointerDrag(slot);
                container.appendChild(slot);
            });
        }

        let activeDrag = null;
        let startX = 0, initialLeft = 0;

        function setupPointerDrag(elem) {
            elem.addEventListener('pointerdown', (e) => {
                activeDrag = elem;
                elem.classList.add('dragging');
                startX = e.clientX;
                initialLeft = parseFloat(elem.style.left);
                elem.setPointerCapture(e.pointerId);
            });

            elem.addEventListener('pointermove', (e) => {
                if (!activeDrag || activeDrag !== elem) return;
                const deltaX = e.clientX - startX;
                const newLeft = initialLeft + deltaX;
                elem.style.left = `${newLeft}px`;

                // Shift neighbors
                const currentPos = currentOrder.indexOf(parseInt(elem.dataset.id));
                const targetPos = Math.max(0, Math.min(currentOrder.length - 1, Math.round((newLeft - (container.clientWidth - currentOrder.length * slotWidth) / 2) / slotWidth)));

                if (targetPos !== currentPos) {
                    currentOrder.splice(currentPos, 1);
                    currentOrder.splice(targetPos, 0, parseInt(elem.dataset.id));
                    updatePositionsExcept(elem.dataset.id);
                }
            });

            const handleUp = (e) => {
                if (!activeDrag || activeDrag !== elem) return;
                elem.classList.remove('dragging');
                activeDrag = null;
                updatePositionsExcept(null);
                checkStage1Complete();
            };

            elem.addEventListener('pointerup', handleUp);
            elem.addEventListener('pointercancel', handleUp);
        }

        function updatePositionsExcept(ignoreId) {
            const totalWidth = currentOrder.length * slotWidth;
            const baseLeft = (container.clientWidth - totalWidth) / 2;

            Array.from(container.children).forEach(slot => {
                if (slot.dataset.id === String(ignoreId)) return;
                const posIndex = currentOrder.indexOf(parseInt(slot.dataset.id));
                slot.style.left = `${baseLeft + posIndex * slotWidth}px`;
            });
        }

        function checkStage1Complete() {
            const isAsc = currentOrder.every((val, i) => i === 0 || val > currentOrder[i - 1]);
            const isDesc = currentOrder.every((val, i) => i === 0 || val < currentOrder[i - 1]);

            if (isAsc || isDesc) {
                setTimeout(() => {
                    document.getElementById('stage-1').classList.add('hidden');
                    document.getElementById('stage-2').classList.remove('hidden');
                }, 400);
            }
        }

        /* STAGE 2: REACTION VESSEL */
        let reagentCount = 0;
        const liquidColors = ['#3b82f6', '#10b981', '#eab308', '#a855f7'];

        function addReagent(color) {
            if (reagentCount >= 4) return;
            reagentCount++;

            const liquidBody = document.getElementById('liquid-body');
            const liquidSurface = document.getElementById('liquid-surface');
            const newY = 210 - (reagentCount * 38);

            liquidBody.setAttribute('y', newY);
            liquidBody.setAttribute('fill', color);
            liquidSurface.setAttribute('cy', newY);
            liquidSurface.setAttribute('fill', color);

            if (reagentCount === 3) {
                // Bubbling before final reagent
                startBubbling();
            } else if (reagentCount === 4) {
                // Trigger Explosion
                triggerExplosion();
            }
        }

        function startBubbling() {
            const container = document.getElementById('bubbles-container');
            for (let i = 0; i < 12; i++) {
                const b = document.createElement('div');
                b.className = 'bubble';
                b.style.left = `${20 + Math.random() * 120}px`;
                b.style.bottom = '20px';
                b.style.width = `${6 + Math.random() * 10}px`;
                b.style.height = b.style.width;
                b.style.animationDelay = `${Math.random() * 1.5}s`;
                container.appendChild(b);
            }
        }

        function triggerExplosion() {
            const area = document.getElementById('reaction-area');
            area.classList.add('exploding');

            setTimeout(() => {
                document.getElementById('stage-2').classList.add('hidden');
                document.getElementById('stage-3').classList.remove('hidden');
            }, 800);
        }

        /* STAGE 3: ENVELOPE */
        function openEnvelope() {
            const env = document.getElementById('envelope');
            env.classList.toggle('open');
        }

        window.addEventListener('resize', renderGlassware);
        window.addEventListener('load', renderGlassware);
    </script>
</body>
</html>
